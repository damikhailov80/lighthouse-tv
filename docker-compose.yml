# The development database. The deployed API points at its own PostgreSQL
# through DATABASE_URL — nothing here is meant to run in production.
services:
  db:
    image: postgres:17-alpine
    container_name: lighthouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lighthouse
      POSTGRES_PASSWORD: lighthouse
      POSTGRES_DB: lighthouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `npm run db:up` waits on this, so migrations never race the first boot
      # of a fresh volume — which takes several seconds while initdb runs.
      test: ["CMD-SHELL", "pg_isready -U lighthouse -d lighthouse"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
    name: lighthouse-pgdata
